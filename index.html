<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131817">
  <title>Rage Cart — After-hours cart return</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="game.js"></script>
</head>
<body>
<main>
  <header class="masthead">
    <div>
      <p class="eyebrow">After-hours cart return</p>
      <h1>RAGE<span>CART</span></h1>
    </div>
    <div class="counter"><span>Wipeouts</span><strong id="stats">00</strong></div>
  </header>
  <section class="cabinet" aria-label="Game">
    <div class="track-bar">
      <span id="stage">01 / Loading bay</span>
      <progress id="progress" value="0" max="100" aria-label="Course progress"></progress>
    </div>
    <canvas id="track" width="480" height="200" aria-label="Shopping cart obstacle course"></canvas>
    <div class="instructions">
      <p id="hint" role="status">Hold D to roll. A backs up.</p>
      <button type="button" id="restart">Restart run</button>
    </div>
  </section>
  <footer class="controls" aria-label="Keyboard controls">
    <span><kbd>A</kbd> <kbd>D</kbd> Steer</span>
    <span><kbd>Alt</kbd> Sprint</span>
    <span><kbd id="jump-key">F4</kbd> Jump</span>
  </footer>
  <p class="keyboard-note">Rage Cart plays with a keyboard.</p>
  <dialog id="result" aria-labelledby="title">
    <h2 id="title"></h2>
    <p id="message"></p>
    <p id="remap" hidden>
      <label for="binding">New jump key</label>
      <select id="binding"><option value="Space">Space</option><option value="KeyJ">J</option><option value="KeyZ">Z</option></select>
    </p>
    <button type="button" id="retry"></button>
  </dialog>
</main>
</body>
</html>
